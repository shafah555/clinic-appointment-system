<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CarePoint Clinic{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
 <div class="container"><a class="navbar-brand fw-bold" href="/">CarePoint <span>Clinic</span></a>
 <div class="navbar-nav ms-auto">
  <a class="nav-link" href="/">Home</a><a class="nav-link" href="/doctors">Doctors</a>
  <a class="nav-link" href="/book">Book</a><a class="nav-link" href="/appointments">Appointments</a>
  <a class="nav-link" href="/billing">Billing</a><a class="nav-link" href="/notifications">Notifications</a>
 </div></div>
</nav>
<main class="container py-4">
 {% with messages = get_flashed_messages(with_categories=true) %}
 {% for category, message in messages %}<div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">{{ message }}</div>{% endfor %}
 {% endwith %}
 {% block content %}{% endblock %}
</main>
</body></html>
